      "summary": "Validated raster image, max 5 MiB, max 5 per product"
      "security":
        -
          "bearerAuth": []
      "x-required-role": "ADMIN"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "required": true
        "content":
          "multipart/form-data":
            "schema":
              "type": "object"
              "properties":
                "file":
                  "type": "string"
                  "format": "binary"
                "altText":
                  "type": "string"
                  "maxLength": 255
              "required":
                - "file"
              "additionalProperties": false
      "responses":
