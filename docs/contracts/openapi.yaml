"components":
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
    "refreshCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "refreshToken"
      "description": "Requires appropriate Origin/CSRF validation in addition to cookie."
  "schemas":
    "Error":
      "type": "object"
      "properties":
        "code":
          "type": "string"
        "message":
          "type": "string"
        "requestId":
          "type": "string"
        "details":
          "type": "object"
          "additionalProperties": true
      "required":
        - "code"
        - "message"
        - "requestId"
      "additionalProperties": false
    "User":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "email":
          "type": "string"
          "format": "email"
        "fullName":
          "type": "string"
        "role":
          "type": "string"
          "enum":
            - "CUSTOMER"
            - "ADMIN"
        "status":
          "type": "string"
          "enum":
            - "ACTIVE"
            - "DISABLED"
      "required":
        - "id"
        - "email"
        - "fullName"
        - "role"
        - "status"
      "additionalProperties": false
    "Register":
      "type": "object"
      "properties":
        "email":
          "type": "string"
          "format": "email"
          "maxLength": 254
        "fullName":
          "type": "string"
          "minLength": 1
          "maxLength": 150
        "password":
          "type": "string"
          "minLength": 10
          "maxLength": 128
          "format": "password"
      "required":
        - "email"
        - "fullName"
        - "password"
      "additionalProperties": false
    "Login":
      "type": "object"
      "properties":
        "email":
          "type": "string"
          "format": "email"
        "password":
          "type": "string"
          "format": "password"
      "required":
        - "email"
        - "password"
      "additionalProperties": false
    "Token":
      "type": "object"
      "properties":
        "accessToken":
          "type": "string"
        "expiresIn":
          "type": "integer"
          "minimum": 1
        "user":
          "$ref": "#/components/schemas/User"
      "required":
        - "accessToken"
        - "expiresIn"
        - "user"
      "additionalProperties": false
    "Category":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "slug":
          "type": "string"
        "description":
          "type":
            - "string"
            - "null"
        "isVisible":
          "type": "boolean"
      "required":
        - "id"
        - "name"
        - "slug"
        - "description"
        - "isVisible"
      "additionalProperties": false
    "CategoryInput":
      "type": "object"
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "slug":
          "type": "string"
          "minLength": 1
          "maxLength": 120
        "description":
          "type": "string"
        "isVisible":
          "type": "boolean"
      "required":
        - "name"
        - "slug"
      "additionalProperties": false
    "CategoryPatch":
      "type": "object"
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "slug":
          "type": "string"
          "minLength": 1
          "maxLength": 120
        "description":
          "type": "string"
        "isVisible":
          "type": "boolean"
      "required": []
      "additionalProperties": false
      "minProperties": 1
    "Product":
      "type": "object"
