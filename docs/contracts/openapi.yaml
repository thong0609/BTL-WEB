      "summary": "Owner cancellation; inventory and payment compensation required"
      "security":
        -
          "bearerAuth": []
      "x-required-role": "CUSTOMER"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 128
          "description": "Stable across retries of the same actor/scope/payload. Different payload with same key returns 409."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Reason"
      "responses":
        "202":
          "description": "Accepted; poll resource for business result."
