      "tags":
        - "Admin"
      "summary": "All categories"
      "security":
        -
          "bearerAuth": []
      "x-required-role": "ADMIN"
      "parameters":
        -
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        -
          "name": "pageSize"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
      "responses":
        "200":
          "description": "Success"
          "content":
