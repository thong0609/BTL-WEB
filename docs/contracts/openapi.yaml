# OpenAPI 3.1 — proposal, not a running API
"openapi": "3.1.0"
"info":
  "title": "Single Store Ecommerce — MVP API"
  "version": "0.1.0"
  "description": "Design contract only; not implemented. Five business services. Money as integer VND strings. See HTTP-API.md for role, state, CSRF and idempotency semantics."
"servers":
  -
    "url": "/api/v1"
    "description": "Same-origin gateway; no deployed server claimed"
"paths":
  "/auth/register":
    "post":
      "operationId": "post_auth_register"
      "tags":
        - "auth"
      "summary": "Register CUSTOMER only"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Register"
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/auth/login":
    "post":
      "operationId": "post_auth_login"
      "tags":
        - "auth"
      "summary": "Login; sets HttpOnly refresh cookie"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/Login"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Token"
          "headers":
            "Set-Cookie":
              "description": "Refresh cookie; HttpOnly, Secure on HTTPS, appropriate SameSite; logout expires it."
              "schema":
                "type": "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/auth/refresh":
    "post":
      "operationId": "post_auth_refresh"
      "tags":
        - "auth"
      "summary": "refresh using cookie with Origin/CSRF validation"
      "security":
        -
          "refreshCookie": []
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Token"
          "headers":
            "Set-Cookie":
              "description": "Refresh cookie; HttpOnly, Secure on HTTPS, appropriate SameSite; logout expires it."
              "schema":
                "type": "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/auth/logout":
    "post":
      "operationId": "post_auth_logout"
      "tags":
        - "auth"
      "summary": "logout using cookie with Origin/CSRF validation"
      "security":
        -
          "refreshCookie": []
      "responses":
        "204":
          "description": "Success"
          "headers":
            "Set-Cookie":
              "description": "Refresh cookie; HttpOnly, Secure on HTTPS, appropriate SameSite; logout expires it."
              "schema":
                "type": "string"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/users/me":
    "get":
      "operationId": "get_users_me"
      "tags":
        - "users"
      "summary": "Current user profile"
      "security":
        -
          "bearerAuth": []
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/products":
    "get":
      "operationId": "get_products"
      "tags":
        - "products"
      "summary": "List ACTIVE products only"
      "security": []
      "parameters":
        -
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        -
          "name": "pageSize"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "q"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "maxLength": 200
        -
          "name": "categoryId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "minPrice"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "pattern": "^[0-9]+$"
            "example": "430000"
        -
          "name": "maxPrice"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "pattern": "^[0-9]+$"
            "example": "430000"
        -
          "name": "sort"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "NEWEST"
              - "PRICE_ASC"
              - "PRICE_DESC"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ProductPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/products/{id}":
    "get":
      "operationId": "get_products_id"
      "tags":
        - "products"
      "summary": "ACTIVE product details"
      "security": []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Product"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/categories":
    "get":
      "operationId": "get_categories"
      "tags":
        - "categories"
      "summary": "Visible navigation categories"
      "security": []
      "parameters":
        -
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        -
          "name": "pageSize"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/CategoryPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/orders/quote":
    "post":
      "operationId": "post_orders_quote"
      "tags":
        - "orders"
      "summary": "Current prices and fee; reserves nothing"
      "security":
        -
          "bearerAuth": []
      "x-required-role": "CUSTOMER"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/QuoteInput"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Quote"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/orders":
    "post":
      "operationId": "post_orders"
      "tags":
        - "orders"
      "summary": "Create once; no client-selected payment result"
      "security":
        -
          "bearerAuth": []
      "x-required-role": "CUSTOMER"
      "parameters":
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 128
          "description": "Stable across retries of the same actor/scope/payload. Different payload with same key returns 409."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateOrder"
      "responses":
        "202":
          "description": "Accepted; poll resource for business result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderAccepted"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
    "get":
      "operationId": "get_orders"
      "tags":
        - "orders"
      "summary": "Only caller orders, including PROCESSING/REJECTED"
      "security":
        -
          "bearerAuth": []
      "x-required-role": "CUSTOMER"
      "parameters":
        -
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        -
          "name": "pageSize"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "status"
          "in": "query"
          "required": false
          "schema":
            "$ref": "#/components/schemas/OrderStatus"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/orders/{id}":
    "get":
      "operationId": "get_orders_id"
      "tags":
        - "orders"
      "summary": "Owner only; 404 for other customer's order"
      "security":
        -
          "bearerAuth": []
      "x-required-role": "CUSTOMER"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/orders/{id}/cancel":
