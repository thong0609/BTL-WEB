[project]
name = "commerce-backend-common"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "structlog>=25,<27",
]

[project.optional-dependencies]
database = ["sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.15,<2"]
messaging = ["aio-pika>=9,<10", "pamqp>=3,<4", "yarl>=1,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_backend_common"]
