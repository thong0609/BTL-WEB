# Test-only stack. Reset is guarded by scripts/local_stack.py; no dev env files.
x-labels: &labels
  io.commerce.environment: test
  io.commerce.workspace: ${WORKSPACE_ID:?Run the infra init script}

services:
  postgres:
    image: postgres:16
    labels: *labels
    environment:
      POSTGRES_DB: commerce_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run the infra init script}
    ports: ["127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"]
    volumes:
      - postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d commerce_test"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq-test
    labels: *labels
    environment:
      RABBITMQ_DEFAULT_USER: commerce_test
      RABBITMQ_DEFAULT_PASS: ${LOCAL_BROKER_PASSWORD:?Run the infra init script}
      RABBITMQ_DEFAULT_VHOST: commerce_test
    ports:
      - 127.0.0.1:${LOCAL_BROKER_PORT:-5673}:5672
      - 127.0.0.1:${LOCAL_MANAGEMENT_PORT:-15673}:15672
    volumes:
      - rabbitmq_test:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 18

volumes:
  postgres_test:
    labels: *labels
  rabbitmq_test:
    labels: *labels
