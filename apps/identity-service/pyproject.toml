[project]
name = "commerce-identity-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "commerce-backend-common[database]",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "argon2-cffi>=25.1,<26",
  "PyJWT[crypto]>=2.15,<3",
  "cryptography>=50.0,<51",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_identity"]
